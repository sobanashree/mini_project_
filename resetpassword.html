<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="/cssstyle/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🔑
        </div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new password for your account
        </p>


        <form onsubmit="resetPassword(event)">

            <label>Email</label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter registered email"
                required
            >


            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >


            <p id="resetMessage"></p>


            <button type="submit"
                    class="primary-btn">

                Reset Password

            </button>

        </form>


        <div class="switch-link">

            Remember your password?

            <a href="index.html">

                Login here

            </a>

        </div>


        <div class="back-link">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>

    </div>

</div>


<script>

function resetPassword(event) {

    event.preventDefault();


    const email =
        document.getElementById("resetEmail")
            .value
            .trim()
            .toLowerCase();


    const newPassword =
        document.getElementById("newPassword")
            .value;


    const confirmPassword =
        document.getElementById("confirmPassword")
            .value;


    const message =
        document.getElementById("resetMessage");


    /* Check email */

    const savedUser =
        localStorage.getItem("user_" + email);


    if (!savedUser) {

        message.textContent =
            "❌ Email not registered.";

        message.style.color = "red";

        return;
    }


    /* Check passwords */

    if (newPassword !== confirmPassword) {

        message.textContent =
            "❌ Passwords do not match.";

        message.style.color = "red";

        return;
    }


    /* Get existing user */

    const user =
        JSON.parse(savedUser);


    /* Change password */

    user.password =
        newPassword;


    /* Save updated user */

    localStorage.setItem(
        "user_" + email,
        JSON.stringify(user)
    );


    message.textContent =
        "✅ Password reset successfully!";

    message.style.color = "green";


    /* Go to login */

    setTimeout(function () {

        window.location.href =
            "index.html";

    }, 1500);

}

</script>

</body>
</html>
